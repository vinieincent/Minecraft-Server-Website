<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Momentan nicht verfügbar</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: rgba(15, 23, 42, 0.8);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: #333;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .container {
        width: min(100%, 760px);
        background: var(--panel);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        padding: 56px 32px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(8px);
      }

      .badge {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 999px;
        border: 1px solid rgba(56, 189, 248, 0.5);
        background: rgba(56, 189, 248, 0.08);
        color: var(--accent);
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 6vw, 4rem);
        line-height: 1.1;
        letter-spacing: -0.04em;
        color: #fff;
      }

      p {
        margin: 20px auto 0;
        max-width: 540px;
        color: var(--muted);
        font-size: 1.1rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="badge">Status</div>
      <h1>Momentan nicht verfügbar</h1>
    </main>
  </body>
</html>
